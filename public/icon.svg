<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle accent rim -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Financial CashFlow Emblem -->
  <g filter="url(#glow)">
    <!-- Upward Trend Dynamic Bar 1 -->
    <rect x="136" y="270" width="48" height="110" rx="12" fill="#334155"/>
    
    <!-- Upward Trend Dynamic Bar 2 -->
    <rect x="204" y="210" width="48" height="170" rx="12" fill="#0284C7"/>
    
    <!-- Upward Trend Dynamic Bar 3 -->
    <rect x="272" y="150" width="48" height="230" rx="12" fill="url(#tealGrad)"/>

    <!-- Dynamic Flow Arrow / Swoosh -->
    <path d="M120 280 C180 230, 240 180, 350 130" fill="none" stroke="url(#tealGrad)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Arrowhead -->
    <polygon points="350,110 380,135 345,155" fill="#34D399"/>

    <!-- Cashflow circle badge (currency node) -->
    <circle cx="370" cy="330" r="42" fill="url(#tealGrad)"/>
    <text x="370" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#064E3B" text-anchor="middle">$</text>
  </g>
</svg>
